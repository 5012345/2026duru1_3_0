<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>일차식 레이싱 대결!</title>
    <style>
        /* 글로벌 스타일 - 세련된 다크 모드와 네온 컬러 */
        :root {
            --bg-color: #121212;
            --text-color: #e0e0e0;
            --accent-green: #2ecc71;
            --accent-yellow: #f1c40f;
            --accent-red: #e74c3c;
            --accent-blue: #3498db;
            --accent-purple: #9b59b6;
            --accent-white: #ffffff;
            --accent-grey: #95a5a6;
            --accent-light: #2c3e50;
            --neon-blue: #00e5ff;
            --neon-pink: #ff0055;
            --primary-font: 'Pretendard', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--primary-font); }
        body { background-color: var(--bg-color); color: var(--text-color); overflow-x: hidden; touch-action: pan-y; }
        .screen { display: none; min-height: 100vh; padding: 40px; }
        .active { display: block; }
        h1, h2 { text-align: center; margin-bottom: 30px; font-weight: 800; text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 0 10px rgba(255, 255, 255, 0.5); }
        h1 { font-size: 3rem; color: var(--neon-blue); }
        h2 { font-size: 2rem; color: var(--neon-pink); }
        p { text-align: center; margin-bottom: 20px; font-size: 1.1rem; line-height: 1.6; }
        button { cursor: pointer; border: none; border-radius: 12px; font-weight: 700; padding: 15px 30px; font-size: 1.1rem; transition: all 0.3s ease; text-transform: uppercase; letter-spacing: 1px; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3); }
        button:active { transform: translateY(2px) scale(0.98); box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3); }
        button:hover { opacity: 0.9; }

        /* 공통 유틸리티 */
        .center-box { max-width: 800px; margin: 0 auto; background: var(--accent-light); padding: 40px; border-radius: 20px; box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5); border: 2px solid rgba(255, 255, 255, 0.05); }
        .text-center { text-align: center; }
        
        /* 초기 화면 */
        .admin-login-btn { position: absolute; top: 20px; right: 20px; background: transparent; color: var(--accent-grey); font-size: 0.9rem; padding: 10px 20px; border: 1px solid var(--accent-grey); border-radius: 8px; }
        .admin-login-btn:hover { background: rgba(149, 165, 166, 0.1); border-color: var(--text-color); color: var(--text-color); }
        #nickname-input { width: 100%; padding: 20px; font-size: 1.3rem; margin-bottom: 30px; text-align: center; border: 2px solid rgba(255, 255, 255, 0.1); border-radius: 12px; background: #000; color: #fff; transition: border-color 0.3s ease; }
        #nickname-input:focus { border-color: var(--neon-blue); outline: none; }
        .car-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
        .car-btn { padding: 25px; font-size: 1.2rem; color: white; border-radius: 15px; position: relative; overflow: hidden; }
        .car-btn span { position: relative; z-index: 1; }
        .car-btn::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(to bottom right, rgba(255, 255, 255, 0.1), rgba(0, 0, 0, 0.2)); z-index: 0; }
        .car-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .c-red { background: linear-gradient(to bottom right, #e74c3c, #c0392b); } 
        .c-yellow { background: linear-gradient(to bottom right, #f1c40f, #f39c12); color: #000; }
        .c-green { background: linear-gradient(to bottom right, #2ecc71, #27ae60); } 
        .c-blue { background: linear-gradient(to bottom right, #3498db, #2980b9); }
        .c-purple { background: linear-gradient(to bottom right, #9b59b6, #8e44ad); } 
        .c-white { background: linear-gradient(to bottom right, #ffffff, #ecf0f1); color: #000; }

        /* 관리자 화면 (트랙) */
        .track-container { background: #080808; padding: 20px; position: relative; border-radius: 15px; border: 2px solid var(--neon-blue); overflow: hidden; margin-bottom: 30px; }
        .finish-line { position: absolute; right: 10%; top: 0; bottom: 0; width: 10px; background: repeating-linear-gradient(to bottom, #fff, #fff 15px, #000 15px, #000 30px); }
        .track-lane { height: 60px; border-bottom: 2px dashed rgba(255, 255, 255, 0.1); position: relative; display: flex; align-items: center; padding-left: 20px; }
        .car-icon { width: 50px; height: 35px; border-radius: 6px; position: absolute; left: 0; transition: left 0.5s ease-out; box-shadow: 0 0 15px rgba(255, 255, 255, 0.3); }
        .car-icon.c-red { background: var(--accent-red); box-shadow: 0 0 15px rgba(231, 76, 60, 0.7); }
        .car-icon.c-yellow { background: var(--accent-yellow); box-shadow: 0 0 15px rgba(241, 196, 15, 0.7); }
        .car-icon.c-green { background: var(--accent-green); box-shadow: 0 0 15px rgba(46, 204, 113, 0.7); }
        .car-icon.c-blue { background: var(--accent-blue); box-shadow: 0 0 15px rgba(52, 152, 219, 0.7); }
        .car-icon.c-purple { background: var(--accent-purple); box-shadow: 0 0 15px rgba(155, 89, 182, 0.7); }
        .car-icon.c-white { background: var(--accent-white); box-shadow: 0 0 15px rgba(255, 255, 255, 0.7); }

        /* 참가자 문제풀이 화면 */
        .card-grid { display: flex; gap: 20px; justify-content: center; margin-bottom: 30px; }
        .card-btn { flex: 1; padding: 40px 20px; font-size: 1.3rem; border-radius: 15px; color: white; transition: transform 0.3s ease; }
        .card-btn span { display: block; margin-top: 10px; font-size: 0.9rem; color: rgba(255, 255, 255, 0.8); }
        .card-btn:hover { transform: translateY(-5px); }
        .card-btn.c-green { background: linear-gradient(to bottom right, #2ecc71, #27ae60); box-shadow: 0 4px 15px rgba(46, 204, 113, 0.5); }
        .card-btn.c-yellow { background: linear-gradient(to bottom right, #f1c40f, #f39c12); color: #000; box-shadow: 0 4px 15px rgba(241, 196, 15, 0.5); }
        .card-btn.c-yellow span { color: rgba(0, 0, 0, 0.8); }
        .card-btn.c-red { background: linear-gradient(to bottom right, #e74c3c, #c0392b); box-shadow: 0 4px 15px rgba(231, 76, 60, 0.5); }

        /* 숫자 패드 */
        #problem-area { max-width: 600px; margin: 0 auto; background: rgba(0, 0, 0, 0.3); padding: 30px; border-radius: 15px; border: 1px solid rgba(255, 255, 255, 0.1); }
        #problem-display { font-size: 1.5rem; text-align: center; margin-bottom: 30px; background: rgba(255, 255, 255, 0.05); padding: 30px; border-radius: 12px; color: var(--neon-blue); line-height: 1.5; text-shadow: 0 0 5px rgba(0, 229, 255, 0.5); }
        #answer-display { font-size: 2rem; text-align: center; height: 60px; line-height: 60px; background: rgba(0, 0, 0, 0.5); margin-bottom: 20px; border-radius: 12px; letter-spacing: 3px; color: var(--neon-pink); border: 2px solid rgba(255, 0, 85, 0.2); }
        .numpad { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; }
        .numpad button { font-size: 1.3rem; padding: 20px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); color: var(--text-color); border-radius: 10px; transition: background 0.2s ease; }
        .numpad button:hover { background: rgba(255, 255, 255, 0.1); }
        .numpad .func-btn { background: rgba(255, 255, 255, 0.1); color: var(--neon-pink); }
        .numpad .func-btn:hover { background: rgba(255, 255, 255, 0.15); }
        .numpad .submit-btn { background: var(--accent-blue); color: white; grid-column: span 2; font-size: 1.2rem; }
        .numpad .submit-btn:hover { background: #2980b9; }

        #btn-change { width: 100%; margin-top: 25px; background: var(--accent-red); color: white; padding: 15px; font-size: 1.1rem; border-radius: 12px; transition: background 0.3s ease; }
        #btn-change:hover { background: #c0392b; }
        #btn-change:disabled { background: var(--accent-grey); opacity: 0.5; }

        /* 미니게임 */
        .minigame-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 15px; margin-top: 30px; }
        .minigame-btn { padding: 20px 0; font-size: 1.2rem; background: rgba(0, 0, 0, 0.3); border: 2px solid var(--accent-blue); border-radius: 12px; color: var(--accent-blue); font-weight: 700; transition: all 0.2s ease; }
        .minigame-btn:hover { background: rgba(52, 152, 219, 0.1); }
        .minigame-btn:disabled { border-color: rgba(255, 255, 255, 0.1); color: rgba(255, 255, 255, 0.3); background: rgba(0, 0, 0, 0.1); }
        .shake { animation: shake 0.5s; background-color: rgba(231, 76, 60, 0.2) !important; border-color: var(--accent-red) !important; color: var(--accent-red) !important; }
        @keyframes shake { 0% { transform: translateX(0); } 25% { transform: translateX(-5px); } 50% { transform: translateX(5px); } 75% { transform: translateX(-5px); } 100% { transform: translateX(0); } }
    </style>
</head>
<body>

    <div id="screen-intro" class="screen active">
        <button class="admin-login-btn" onclick="loginAdmin()">관리자 로그인</button>
        <div class="center-box text-center">
            <h1>🏎️ 일차식 레이싱!</h1>
            <p>닉네임을 입력하고 원하는 자동차를 선택하세요!</p>
            <input type="text" id="nickname-input" placeholder="여기에 닉네임 입력">
            <div class="car-grid">
                <button class="car-btn c-red" onclick="joinCar('빨강')"><span>빨강 자동차</span><br><span>(<span id="cnt-빨강">0</span>/5)</span></button>
                <button class="car-btn c-yellow" onclick="joinCar('노랑')"><span>노랑 자동차</span><br><span>(<span id="cnt-노랑">0</span>/5)</span></button>
                <button class="car-btn c-green" onclick="joinCar('초록')"><span>초록 자동차</span><br><span>(<span id="cnt-초록">0</span>/5)</span></button>
                <button class="car-btn c-blue" onclick="joinCar('파랑')"><span>파랑 자동차</span><br><span>(<span id="cnt-파랑">0</span>/5)</span></button>
                <button class="car-btn c-purple" onclick="joinCar('보라')"><span>보라 자동차</span><br><span>(<span id="cnt-보라">0</span>/5)</span></button>
                <button class="car-btn c-white" onclick="joinCar('흰색')"><span>흰색 자동차</span><br><span>(<span id="cnt-흰색">0</span>/5)</span></button>
            </div>
        </div>
    </div>

    <div id="screen-wait" class="screen">
        <div class="center-box text-center">
            <h2>🚦 출발 준비중...</h2>
            <p>관리자의 시작 신호를 기다리고 있습니다.</p>
        </div>
    </div>

    <div id="screen-player" class="screen">
        <div class="center-box">
            <p class="text-center" style="color: var(--neon-blue);">문제를 맞춰 전진하세요!</p>
            <div class="card-grid" id="difficulty-cards">
                <button class="card-btn c-green" onclick="showProblem('초급')">초급 <span>(+2km)</span></button>
                <button class="card-btn c-yellow" onclick="showProblem('중급')">중급 <span>(+4km)</span></button>
                <button class="card-btn c-red" onclick="showProblem('상급')">상급 <span>(+8km)</span></button>
            </div>

            <div id="problem-area" style="display: none;">
                <div id="problem-display">문제가 여기에 표시됩니다.</div>
                <div id="answer-display"></div>
                
                <div class="numpad">
                    <button onclick="inputPad('1')">1</button>
                    <button onclick="inputPad('2')">2</button>
                    <button onclick="inputPad('3')">3</button>
                    <button class="func-btn" onclick="inputPad('+')">+</button>
                    
                    <button onclick="inputPad('4')">4</button>
                    <button onclick="inputPad('5')">5</button>
                    <button onclick="inputPad('6')">6</button>
                    <button class="func-btn" onclick="inputPad('-')">-</button>
                    
                    <button onclick="inputPad('7')">7</button>
                    <button onclick="inputPad('8')">8</button>
                    <button onclick="inputPad('9')">9</button>
                    <button class="func-btn" onclick="inputPad('x')">x</button>
                    
                    <button class="func-btn" onclick="inputPad('C')">C</button>
                    <button onclick="inputPad('0')">0</button>
                    <button class="submit-btn" onclick="submitAnswer()">정답 제출</button>
                </div>
                
                <button id="btn-change" onclick="changeProblem()">문제 교체 (3초 대기)</button>
            </div>
        </div>
    </div>

    <div id="screen-minigame" class="screen">
        <div class="center-box text-center">
            <h2>🚨 긴급 미션! 🚨</h2>
            <p>제일 작은 숫자부터 차례대로 누르세요!</p>
            <div class="minigame-grid" id="minigame-board"></div>
        </div>
    </div>

    <div id="screen-admin" class="screen">
        <div class="center-box" style="max-width: 900px;">
            <h2>관리자 모드</h2>
            <div class="track-container">
                <div class="finish-line"></div>
                <div class="track-lane"><div id="car-빨강" class="car-icon c-red"></div></div>
                <div class="track-lane"><div id="car-노랑" class="car-icon c-yellow"></div></div>
                <div class="track-lane"><div id="car-초록" class="car-icon c-green"></div></div>
                <div class="track-lane"><div id="car-파랑" class="car-icon c-blue"></div></div>
                <div class="track-lane"><div id="car-보라" class="car-icon c-purple"></div></div>
                <div class="track-lane"><div id="car-흰색" class="car-icon c-white"></div></div>
            </div>
            
            <div class="text-center" style="margin-top: 30px;">
                <button onclick="startRace()" style="background: var(--accent-green); color: white; padding: 15px 40px; font-size: 1.2rem;">레이스 시작!</button>
                <button onclick="alert('참가자 닉네임 수정 및 퇴장 기능은 Firebase 연동 후 활성화됩니다.')" style="background: transparent; color: var(--accent-grey); border: 1px solid var(--accent-grey); margin-left: 20px;">참가자 관리</button>
            </div>
        </div>
    </div>

    <script>
        // 전역 상태 변수
        let myNickname = "";
        let myCar = "";
        let currentProblem = null;
        let currentLevel = "";
        let myDistance = 0; 
        let hasPenalty = false;

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function loginAdmin() {
            if(prompt("관리자 비밀번호를 입력하세요") === "2525") {
                showScreen("screen-admin");
            } else {
                alert("비밀번호가 틀렸습니다.");
            }
        }

        function joinCar(carColor) {
            const nickname = document.getElementById('nickname-input').value.trim();
            if(!nickname) return alert("닉네임을 입력해주세요!");
            myNickname = nickname;
            myCar = carColor;
            showScreen("screen-wait");
        }

        function startRace() {
            alert("레이스가 시작되었습니다! 참가자 화면이 전환됩니다.");
            showScreen("screen-player");
        }

        function generateMathProblem(level) {
            let q = "", a = "";
            const rand = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
            const nonZeroRand = (min, max) => { let v=0; while(v===0) v = rand(min,max); return v; };

            if(level === '초급') {
                let coeff = nonZeroRand(-9, 9);
                let constant = nonZeroRand(-9, 9);
                q = `${coeff}x ${constant > 0 ? '+'+constant : constant} 에서 x의 계수는?`;
                a = coeff.toString();
            } 
            else if(level === '중급') {
                let c1 = nonZeroRand(-5, 5);
                let num = nonZeroRand(-5, 5);
                q = `(${c1}x) × (${num}) 의 계산 결과에서 x의 계수는?`;
                a = (c1 * num).toString();
            } 
            else if(level === '상급') {
                let denom = rand(2, 5); 
                let c1 = nonZeroRand(-5, 5) * denom; 
                let c2 = nonZeroRand(-5, 5) * denom;
                q = `(1/${denom}) × (${c1}x ${c2 > 0 ? '+'+c2 : c2}) 의 계산 결과에서 상수항은?`;
                a = (c2 / denom).toString();
            }
            return { question: q, answer: a };
        }

        function showProblem(level) {
            currentLevel = level;
            document.getElementById('difficulty-cards').style.display = 'none';
            document.getElementById('problem-area').style.display = 'block';
            document.getElementById('answer-display').innerText = "";
            
            currentProblem = generateMathProblem(level);
            document.getElementById('problem-display').innerText = currentProblem.question;
        }

        function inputPad(val) {
            let display = document.getElementById('answer-display');
            if(val === 'C') {
                display.innerText = display.innerText.slice(0, -1);
            } else {
                display.innerText += val;
            }
        }

        function submitAnswer() {
            let userAnswer = document.getElementById('answer-display').innerText;
            if(userAnswer === currentProblem.answer) {
                let moveDist = currentLevel === '초급' ? 2 : currentLevel === '중급' ? 4 : 8;
                if(hasPenalty) moveDist -= 1;
                
                myDistance += moveDist; 
                alert(`정답입니다! 자동차가 ${moveDist}km 전진합니다. (현재 ${myDistance}km)`);
                
                checkTriggers();
                
                document.getElementById('difficulty-cards').style.display = 'flex';
                document.getElementById('problem-area').style.display = 'none';
            } else {
                alert("틀렸습니다. 다시 계산해보세요!");
                document.getElementById('answer-display').innerText = "";
            }
        }

        function changeProblem() {
            const btn = document.getElementById('btn-change');
            btn.disabled = true;
            btn.innerText = "3초 후 교체 가능...";
            
            setTimeout(() => {
                currentProblem = generateMathProblem(currentLevel);
                document.getElementById('problem-display').innerText = currentProblem.question;
                document.getElementById('answer-display').innerText = "";
                btn.disabled = false;
                btn.innerText = "문제 교체 (3초 대기)";
            }, 3000);
        }

        function checkTriggers() {
            if(myDistance >= 50 && myDistance < 55 && !window.did50km) {
                window.did50km = true;
                startMinigame();
            } else if(myDistance >= 100 && myDistance < 105 && !window.did100km) {
                window.did100km = true;
                startMinigame();
            } else if(myDistance >= 150 && !hasPenalty) {
                alert("🚨 150km 최초 돌파! 패널티가 적용되어 앞으로 이동 거리가 1km 감소합니다.");
                hasPenalty = true;
            } else if(myDistance >= 200) {
                alert("🏁 200km 결승선 통과! 최종 우승 화면으로 이동합니다.");
            }
        }

        let minigameTargetSequence = [];
        let currentClickIndex = 0;
        
        function startMinigame() {
            showScreen("screen-minigame");
            const board = document.getElementById('minigame-board');
            board.innerHTML = "";
            
            let nums = [];
            while(nums.length < 10) {
                let r = Math.floor(Math.random() * 101) - 50;
                if(!nums.includes(r)) nums.push(r);
            }
            
            minigameTargetSequence = [...nums].sort((a,b) => a - b);
            currentClickIndex = 0;

            nums.forEach(n => {
                let btn = document.createElement('button');
                btn.className = "minigame-btn";
                btn.innerText = n;
                btn.onclick = () => handleMinigameClick(btn, n);
                board.appendChild(btn);
            });
        }

        function handleMinigameClick(btn, num) {
            if(num === minigameTargetSequence[currentClickIndex]) {
                btn.disabled = true; 
                currentClickIndex++;
                if(currentClickIndex >= 10) {
                    alert("미니게임 통과! 레이스로 복귀합니다.");
                    showScreen("screen-player");
                    document.getElementById('difficulty-cards').style.display = 'flex';
                    document.getElementById('problem-area').style.display = 'none';
                }
            } else {
                const board = document.getElementById('minigame-board');
                board.classList.add("shake");
                board.style.pointerEvents = "none"; 
                
                setTimeout(() => {
                    board.classList.remove("shake");
                    board.style.pointerEvents = "auto";
                }, 3000);
            }
        }

    </script>
</body>
</html>
